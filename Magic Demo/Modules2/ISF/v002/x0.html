<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>X0 — chiffre à clé</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#141a20; --panel:#1b232b; --ink:#e8e3d8; --dim:#8ea0aa;
  --brass:#c08b45; --brass-dim:#6d5230; --line:#2a333b; --err:#c1524f;
}
*{box-sizing:border-box;}
html{scroll-padding-top:env(safe-area-inset-top,0px);}
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:'Space Mono', ui-monospace, Menlo, Consolas, monospace;
  padding:calc(28px + env(safe-area-inset-top,0px)) 18px calc(40px + env(safe-area-inset-bottom,0px));
  min-height:100%; line-height:1.5;
}
main{max-width:600px; margin:0 auto;}
h1{font-size:2.4rem; margin:0 0 4px; letter-spacing:2px; color:var(--ink); font-weight:700;}
.tag{color:var(--dim); font-size:0.9rem; margin:0 0 32px; max-width:46ch;}
section{border-top:2px solid var(--brass); background:var(--panel); border-radius:3px; padding:18px 20px; margin-bottom:18px;}
label{display:block; font-size:0.8rem; color:var(--dim); margin-bottom:8px;}
.row{display:flex; gap:10px;}
input[type=text]{
  flex:1; background:#0f1418; color:var(--brass); border:1px solid var(--line); border-radius:2px;
  padding:10px 12px; font-family:inherit; font-size:1rem; min-width:0;
}
button{
  background:transparent; color:var(--brass); border:1px solid var(--brass-dim); border-radius:2px;
  padding:10px 14px; font-family:inherit; font-size:0.85rem; cursor:pointer; white-space:nowrap;
}
button:hover{border-color:var(--brass); background:rgba(192,139,69,0.08);}
button.active{background:var(--brass); color:#141a20; border-color:var(--brass);}
.tabs{display:flex; gap:8px; margin-bottom:14px;}
textarea{
  width:100%; min-height:90px; background:#0f1418; color:var(--ink); border:1px solid var(--line);
  border-radius:2px; padding:12px; font-family:inherit; font-size:0.95rem; resize:vertical;
}
.output{
  margin-top:14px; background:#0f1418; border:1px solid var(--line); border-radius:2px; padding:12px;
  font-size:0.95rem; word-break:break-all; min-height:48px; color:var(--brass);
}
.output.empty{color:var(--dim);}
.small{font-size:0.78rem; color:var(--dim); margin-top:8px;}
table{width:100%; border-collapse:collapse; font-size:0.82rem; margin-top:12px;}
td{border-bottom:1px solid var(--line); padding:4px 6px;}
td:first-child{color:var(--ink); width:2.2em;}
td:last-child{color:var(--brass); overflow-wrap:anywhere;}
#mapWrap{display:none; max-height:280px; overflow-y:auto; overflow-x:hidden;}
.toolbar{display:flex; justify-content:space-between; align-items:center; gap:10px; margin-top:16px;}
</style>
</head>
<body>
<main>
  <h1>X0</h1>
  <p class="tag">Chaque caractère devient un bloc de six symboles x/0. L'ordre d'attribution dépend de la clé : sans elle, le message reste illisible.</p>

  <section>
    <label for="key">Clé secrète</label>
    <div class="row">
      <input type="text" id="key" placeholder="ex : ardoise-4127" value="ardoise-4127">
      <button id="randKey">Nouvelle clé</button>
    </div>
  </section>

  <section>
    <div class="tabs">
      <button id="modeEnc" class="active">Chiffrer</button>
      <button id="modeDec">Déchiffrer</button>
    </div>
    <label id="inLabel" for="msg">Texte à chiffrer</label>
    <textarea id="msg" placeholder="Écris ton message ici…"></textarea>
    <div class="output empty" id="out">le résultat s'affiche ici</div>
    <div class="toolbar">
      <button id="copyBtn">Copier le résultat</button>
      <span class="small" id="count"></span>
    </div>
  </section>

  <section>
    <button id="toggleMap">Afficher la clé de correspondance</button>
    <div id="mapWrap"><table id="mapTable"></table></div>
  </section>
</main>

<script>
const CHARSET = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789 .,!?'-";

function hash32(str){
  let h = 1779033703 ^ str.length;
  for(let i=0;i<str.length;i++){
    h = Math.imul(h ^ str.charCodeAt(i), 3432918353);
    h = (h<<13)|(h>>>19);
  }
  return (h ^ (h>>>16)) >>> 0;
}
function mulberry32(a){
  return function(){
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ a>>>15, 1 | a);
    t = (t + Math.imul(t ^ t>>>7, 61 | t)) ^ t;
    return ((t ^ t>>>14) >>> 0) / 4294967296;
  };
}
function buildMaps(key){
  const rnd = mulberry32(hash32(key || "X0"));
  const codes = [];
  for(let i=0;i<64;i++){
    codes.push(i.toString(2).padStart(6,'0').split('').map(b=>b==='0'?'0':'x').join(''));
  }
  for(let i=codes.length-1;i>0;i--){
    const j = Math.floor(rnd()*(i+1));
    [codes[i],codes[j]] = [codes[j],codes[i]];
  }
  const charToCode = {}, codeToChar = {};
  for(let i=0;i<CHARSET.length;i++){
    charToCode[CHARSET[i]] = codes[i];
    codeToChar[codes[i]] = CHARSET[i];
  }
  return {charToCode, codeToChar};
}
function normalize(t){
  return t.toUpperCase()
    .replace(/[ÉÈÊË]/g,'E').replace(/[ÀÂ]/g,'A').replace(/[ÙÛÜ]/g,'U')
    .replace(/[ÎÏ]/g,'I').replace(/Ô/g,'O').replace(/Ç/g,'C');
}
function encode(text,key){
  const {charToCode} = buildMaps(key);
  let out = '';
  for(const ch of normalize(text)) out += charToCode[ch] ?? '';
  return out;
}
function decode(code,key){
  const {codeToChar} = buildMaps(key);
  const clean = code.replace(/[^x0]/gi,'').toLowerCase();
  let out = '';
  for(let i=0;i+6<=clean.length;i+=6) out += codeToChar[clean.slice(i,i+6)] ?? '¿';
  return out;
}

const keyEl = document.getElementById('key');
const msgEl = document.getElementById('msg');
const outEl = document.getElementById('out');
const inLabel = document.getElementById('inLabel');
const countEl = document.getElementById('count');
let mode = 'enc';

function refresh(){
  const key = keyEl.value.trim();
  const val = msgEl.value;
  let result = '';
  if(val.trim()){
    result = mode === 'enc' ? encode(val,key) : decode(val,key);
  }
  outEl.textContent = result || 'le résultat s\'affiche ici';
  outEl.classList.toggle('empty', !result);
  countEl.textContent = result ? (mode==='enc' ? result.length/6 + ' caractères codés' : result.length + ' caractères décodés') : '';
  if(document.getElementById('mapWrap').style.display === 'block') renderMap(key);
}
function renderMap(key){
  const {charToCode} = buildMaps(key);
  const rows = CHARSET.split('').map(c => `<tr><td>${c===' '?'␣':c}</td><td>${charToCode[c]}</td></tr>`).join('');
  document.getElementById('mapTable').innerHTML = rows;
}
document.getElementById('modeEnc').onclick = () => {
  mode='enc';
  document.getElementById('modeEnc').classList.add('active');
  document.getElementById('modeDec').classList.remove('active');
  inLabel.textContent = 'Texte à chiffrer';
  msgEl.placeholder = 'Écris ton message ici…';
  refresh();
};
document.getElementById('modeDec').onclick = () => {
  mode='dec';
  document.getElementById('modeDec').classList.add('active');
  document.getElementById('modeEnc').classList.remove('active');
  inLabel.textContent = 'Code à déchiffrer';
  msgEl.placeholder = 'Colle ici un bloc de x et de 0…';
  refresh();
};
document.getElementById('randKey').onclick = () => {
  const mots = ['ronce','fumée','grillon','cuivre','ardoise','tilleul','brume','cendre','loutre','silex','givre','orage'];
  keyEl.value = mots[Math.floor(Math.random()*mots.length)] + '-' + Math.floor(1000+Math.random()*9000);
  refresh();
};
document.getElementById('copyBtn').onclick = () => {
  const text = outEl.textContent;
  if(!text || outEl.classList.contains('empty')) return;
  try{ navigator.clipboard.writeText(text); }catch(e){}
};
document.getElementById('toggleMap').onclick = () => {
  const wrap = document.getElementById('mapWrap');
  const show = wrap.style.display !== 'block';
  wrap.style.display = show ? 'block' : 'none';
  document.getElementById('toggleMap').textContent = show ? 'Masquer la clé de correspondance' : 'Afficher la clé de correspondance';
  if(show) renderMap(keyEl.value.trim());
};
keyEl.addEventListener('input', refresh);
msgEl.addEventListener('input', refresh);
refresh();
</script>
</body>
</html>
